<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
    <title>HomiDirect - Sign up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styling/styles.css">
</head>

<body>
    <main class="auth-page">
        <div class="auth-card" style="--auth-image: url('../public/hero-bg.jpg')">

            <div class="dropdown auth-lang">
                <button class="icon-button" id="lang-button" data-i18n-aria="nav.language" aria-haspopup="true"
                    aria-expanded="false">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M2 12h20" />
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                    </svg>
                </button>
                <ul class="dropdown-menu" id="lang-menu" hidden>
                    <li><button data-lang="en">English</button></li>
                    <li><button data-lang="el">Ελληνικά</button></li>
                </ul>
            </div>

            <section class="auth-form-side">
                <div class="auth-brand">
                    <img src="../public/logo.png" alt="HomiDirect logo">
                    <span><b>Homi</b>Direct</span>
                </div>

                <form class="auth-form" data-auth="signup" method="post" novalidate>
                    <h1 class="auth-title" data-i18n="signup.h1">Εγγραφείτε τώρα</h1>

                    <p class="auth-subtitle" data-i18n="auth.signup.subtitle">Βρες ή καταχώρησε ακίνητο χωρίς μεσίτη.
                    </p>

                    <div class="auth-field">
                        <label class="auth-label" for="name" data-i18n="auth.name">Ονοματεπώνυμο</label>
                        <input class="auth-input" type="text" id="name" name="name" autocomplete="name"
                            placeholder="Ονοματεπώνυμο" data-i18n-placeholder="auth.name.placeholder" required>
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="email" data-i18n="auth.email">Email</label>
                        <input class="auth-input" type="email" id="email" name="email" autocomplete="email" required
                            placeholder="name@example.com" data-i18n-placeholder="auth.email.placeholder">
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="password" data-i18n="auth.password">Κωδικός Πρόσβασης</label>
                        <div class="password-field">
                            <input class="auth-input" type="password" id="password" name="password"
                                autocomplete="new-password" minlength="8" placeholder="κωδικός"
                                data-i18n-placeholder="auth.password.placeholder" required>
                            <button type="button" class="password-toggle" aria-label="Εμφάνιση κωδικού"
                                aria-pressed="false">
                                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true" hidden>
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                        <span class="auth-hint" data-i18n="auth.password.hint">Τουλάχιστον 8 χαρακτήρες.</span>
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="verify-password" data-i18n="auth.verify.password">Επαλήθευση
                            Κωδικού</label>
                        <div class="password-field">
                            <input class="auth-input" type="password" id="verify-password" name="verify-password"
                                autocomplete="new-password" minlength="8" placeholder="επαλήθευση κωδικού"
                                data-i18n-placeholder="auth.verify.password.placeholder" required>
                            <button type="button" class="password-toggle" aria-label="Εμφάνιση κωδικού"
                                aria-pressed="false">
                                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true" hidden>
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <label class="auth-terms">
                        <input type="checkbox" name="terms" required>
                        <span data-i18n-html="auth.terms">Συμφωνώ με τους <a href="terms.html" target="_blank"
                                rel="noopener">Όρους Χρήσης</a> και την <a href="privacy.html" target="_blank"
                                rel="noopener">Πολιτική Απορρήτου</a>.</span>
                    </label>

                    <button class="auth-btn" type="submit" data-i18n="auth.signup.submit" disabled>Δημιουργία
                        λογαριασμού</button>

                    <div class="auth-divider" data-i18n="auth.or">ή</div>

                    <button class="auth-btn auth-social" type="button">
                        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                        </svg>
                        <span data-i18n="auth.google">Συνέχεια με
                            Google</span>
                    </button>

                    <p class="auth-switch"><span data-i18n="auth.haveAccount">Έχεις ήδη λογαριασμό;</span> <a
                            href="login.html" data-i18n="auth.login.link">Σύνδεση.</a></p>
                </form>
            </section>
            <div class="auth-image-side" aria-hidden="true"></div>
        </div>
    </main>

    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/auth.js"></script>

</body>

</html>
